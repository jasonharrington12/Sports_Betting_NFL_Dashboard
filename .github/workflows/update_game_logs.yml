name: Update NFL Game Logs

on:
  # Run every Tuesday at 6 AM UTC (Monday night games are always done by then)
  schedule:
    - cron: "0 6 * * 2"
  # Also allow manual trigger from the GitHub Actions tab
  workflow_dispatch:

jobs:
  update-csv:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests pandas

      - name: Run scraper
        run: python _scrape_to_csv.py

      - name: Commit updated CSV if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add nfl_game_logs.csv
          if git diff --cached --quiet; then
            echo "No new games — CSV unchanged, nothing to commit."
          else
            git commit -m "data: auto-update nfl_game_logs.csv (weekly scrape)"
            git push
          fi
